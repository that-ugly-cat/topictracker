<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User guide — TopicTracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #0f1117; color: #e2e8f0; font-size: 14px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    /* The page is standalone rather than extending base.html: it is public, and
       the shared nav offers links that only make sense once you are signed in. */
    nav { display: flex; align-items: center; gap: 1.5rem; padding: .75rem 2rem;
          background: #0a0c12; border-bottom: 1px solid #1e2235; }
    nav a { color: #a8b2c4; text-decoration: none; font-size: 13px; }
    nav a:hover { color: #e2e8f0; }
    nav .brand { font-weight: 700; font-size: 15px; color: #e2e8f0; }
    nav .brand span { color: #7aa2f7; }
    nav .spacer { flex: 1; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
    .guide h1 { font-size: 25px; margin: 6px 0 14px; }
    .guide h2 { font-size: 18px; margin: 30px 0 10px; color: #7aa2f7; }
    .guide h3 { font-size: 15px; margin: 20px 0 8px; }
    .guide p, .guide li { line-height: 1.7; color: #a8b2c4; margin-bottom: 10px; }
    .guide ul, .guide ol { padding-left: 1.3rem; }
    .guide strong { color: #e2e8f0; }
    .guide a { color: #7aa2f7; }
    .guide code { background: #171a26; border: 1px solid #1e2235; border-radius: 3px;
                  padding: 1px 5px; font-size: 12.5px; }
    .guide pre { background: #171a26; border: 1px solid #1e2235; border-radius: 6px;
                 padding: 12px 14px; overflow-x: auto; margin-bottom: 12px; }
    .guide pre code { border: 0; padding: 0; background: none; }
    .guide table { border-collapse: collapse; margin: 12px 0; display: block; overflow-x: auto; }
    .guide th, .guide td { border: 1px solid #1e2235; padding: 6px 10px; text-align: left;
                           vertical-align: top; }
    .guide th { background: #171a26; color: #e2e8f0; }
    .guide hr { border: 0; border-top: 1px solid #1e2235; margin: 26px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">Topic<span>Tracker</span></a>
    <div class="spacer"></div>
    <a href="/app">Sign in ↗</a>
  </nav>
  <div class="wrap"><article class="guide">{{ guide_html | safe }}</article></div>
</body>
</html>

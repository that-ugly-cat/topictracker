<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TopicTracker{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e2e8f0;
      font-size: 14px;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.75rem 2rem;
      background: #0a0c12;
      border-bottom: 1px solid #1e2235;
    }

    nav .brand {
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    nav .brand span { color: #4a6fa5; }

    nav a {
      font-size: 0.82rem;
      color: #718096;
      text-decoration: none;
    }

    nav a:hover { color: #e2e8f0; }

    nav .spacer { flex: 1; }

    nav .user-info {
      font-size: 0.78rem;
      color: #4a5568;
    }

    /* ── Layout ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Typography ── */
    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    h2 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; margin-bottom: 0.75rem; }
    h3 { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; margin-bottom: 0.5rem; }

    p { color: #a0aec0; line-height: 1.6; }

    /* ── Cards ── */
    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* ── Forms ── */
    label {
      display: block;
      font-size: 0.75rem;
      color: #a0aec0;
      margin-bottom: 0.3rem;
      margin-top: 1rem;
    }

    input[type=text], input[type=email], input[type=password],
    input[type=number], textarea, select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, textarea:focus, select:focus { border-color: #4a6fa5; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-primary { background: #0a3c8a; color: #fff; }
    .btn-primary:hover { background: #0d4fa8; }

    .btn-secondary { background: #1e2235; color: #a0aec0; border: 1px solid #2d3148; }
    .btn-secondary:hover { background: #252a3e; color: #e2e8f0; }

    .btn-danger { background: #7b2020; color: #fff; }
    .btn-danger:hover { background: #922727; }

    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-pending    { background: #2d2d0f; color: #d4c040; }
    .badge-download   { background: #0f2d3d; color: #40a4d4; }
    .badge-analysing  { background: #1d0f3d; color: #8040d4; }
    .badge-done       { background: #0f2d1d; color: #40d490; }
    .badge-error      { background: #2d0f0f; color: #d44040; }

    /* ── Progress bar ── */
    .progress-wrap {
      background: #1e2235;
      border-radius: 4px;
      height: 8px;
      margin: 0.75rem 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #0a3c8a;
      transition: width 0.4s ease;
      border-radius: 4px;
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid #1e2235; }
    th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: #4a5568; font-weight: 700; }
    td { font-size: 0.85rem; color: #a0aec0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1a1d27; }

    /* ── Alerts ── */
    .alert {
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .alert-error { background: #2d1515; border: 1px solid #7b2020; color: #fc8181; }
    .alert-info  { background: #0f1d2d; border: 1px solid #1e4a6a; color: #63b3ed; }
    .alert-ok    { background: #0f2d1d; border: 1px solid #1e6a3a; color: #68d391; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

    .tab {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid #2d3148;
      background: #1a1d27;
      color: #718096;
    }

    .tab.active, .tab:hover { background: #0a3c8a; color: #fff; border-color: #0a3c8a; }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Misc ── */
    .muted { color: #4a5568; font-size: 0.8rem; }
    .mt-1  { margin-top: 0.5rem; }
    .mt-2  { margin-top: 1rem; }
    .mt-3  { margin-top: 1.5rem; }
    .mb-1  { margin-bottom: 0.5rem; }

    hr { border: none; border-top: 1px solid #1e2235; margin: 1.5rem 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <nav>
    <a href="/" class="brand">Topic<span>Tracker</span></a>
    <a href="/new">New run</a>
    {% if user and user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <div class="spacer"></div>
    {% if user %}
      <span class="user-info">{{ user.name or user.email }}</span>
      <a href="/logout">Sign out</a>
    {% endif %}
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
